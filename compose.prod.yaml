services:
  web:
    depends_on:
      - db
    image: "horsecatdog/${PROJECT}:${WEB_IMAGE_TAG:-latest}"
    restart: always
    # Needed so the entrypoint can a2ensite/a2enmod and edit ports.conf on
    # every start; it drops to www-data itself before exec'ing apache2ctl.
    user: root
    entrypoint:
        ["/bin/sh", "/app/scripts/web/prod_entrypoint.sh"]
    environment:
      BEDROCK_ROOT: "/www/srv"
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB: ${WORDPRESS_DB}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password_prod
      WP_DEBUG: ${WP_DEBUG}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password_prod
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
      WEB_PROTOCOL: ${WEB_PROTOCOL}
      WP_ENVIRON: ${WP_ENV}
      PROJECT: ${PROJECT}
      THEME: ${THEME}
      WORDPRESS_SMTP_HOST: ${WORDPRESS_SMTP_HOST}
      WORDPRESS_SMTP_PORT: ${WORDPRESS_SMTP_PORT}
      WORDPRESS_SMTP_ENCRYPTION: ${WORDPRESS_SMTP_ENCRYPTION}
      WORDPRESS_SMTP_USER: ${WORDPRESS_SMTP_USER}
      WORDPRESS_SMTP_PASS_FILE: /run/secrets/smtp_password_prod
      WORDPRESS_SMTP_FROM_EMAIL: ${WORDPRESS_SMTP_FROM_EMAIL}
      WORDPRESS_SMTP_FROM_NAME: ${WORDPRESS_SMTP_FROM_NAME}
    volumes:
      - ./scripts:/app/scripts
      - wp_uploads_prod:/www/srv/${PROJECT}/web/app/uploads
      # Generated once by `task configure` (see gen_bedrock_env.py /
      # gen_apache_conf.py) and persisted on the host, so a container
      # restart or recreate doesn't lose them and doesn't need config
      # regenerated inside the container.
      - ./config/bedrock.env:/www/srv/${PROJECT}/.env:ro
      - ./config/apache-wordpress.conf:/etc/apache2/sites-available/wordpress.conf:ro
    secrets:
      - db_password_prod
      - wp_admin_password_prod
      - smtp_password_prod
    networks:
      - frontend_network
      - backend_network

  db:
    image: "mariadb:latest"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_prod
      MARIADB_DATABASE: wordpress_prod
      MARIADB_USER: wordpress_prod
      MARIADB_PASSWORD_FILE: /run/secrets/db_password_prod
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    secrets:
      - db_password_prod
      - db_root_password_prod
    networks:
      - backend_network

  proxy:
    depends_on:
      - web
    image: nginx:stable-alpine
    environment:
      PROXY_PORT_HTTP: ${PROXY_PORT_HTTP}
      PROXY_PORT_HTTPS: ${PROXY_PORT_HTTPS}
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
    ports:
      - "${LOCAL_PORT_HTTP}:${PROXY_PORT_HTTP}"
      - "${LOCAL_PORT_HTTPS}:${PROXY_PORT_HTTPS}"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/html
    networks:
      - frontend_network

  backup:
    depends_on:
      - db
    image: databack/mysql-backup:latest
    restart: always
    environment:
      DB_SERVER: db
      DB_PORT: 3306
      DB_USER: ${WORDPRESS_DB_USER}
      DB_PASS_FILE: /run/secrets/db_password_prod
      DB_NAMES: ${WORDPRESS_DB}
      DB_DUMP_TARGET: ${BACKUP_S3_TARGET}
      DB_DUMP_FREQ: 1440
      DB_DUMP_BEGIN: 0300
      DB_DUMP_KEEP: 14
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_key_prod
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_prod
      AWS_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION}
    secrets:
      - db_password_prod
      - backup_s3_key_prod
      - backup_s3_secret_prod
    networks:
      - backend_network

  # wp_uploads_prod holds actual uploaded files (student photos, documents,
  # etc.) - only the database was backed up before this, so anything in
  # here was one docker volume mishap away from being unrecoverable.
  # No Docker socket mount: that's only needed to pause/resume other
  # containers for consistency mid-backup, which matters for a live
  # database but not for a directory of already-written files - skipping it
  # avoids handing this container host-level access for no real benefit.
  uploads-backup:
    image: offen/docker-volume-backup:v2.48.2
    restart: always
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "wp-uploads-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: 14
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET_NAME}
      AWS_S3_PATH: uploads
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      AWS_ENDPOINT_PROTO: https
      AWS_REGION: ${BACKUP_S3_REGION}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_key_prod
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_prod
    volumes:
      - wp_uploads_prod:/backup/wp-uploads:ro
    secrets:
      - backup_s3_key_prod
      - backup_s3_secret_prod
    networks:
      - backend_network

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/html
    entrypoint: "/bin/sh"
    command: >
      -c "trap exit TERM; 
      while :; do 
        certbot renew; 
        sleep 12h & wait $${!}; 
      done;"

volumes:
  mariadb_prod_data:
  wp_uploads_prod:
  certbot-etc:
  certbot-var:
  webroot:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge

secrets:
  db_password_prod:
    file: ${DB_WORDPRESS_PASSWORD_FILE}
  db_root_password_prod:
    file: ${DB_ROOT_PASSWORD_FILE}
  wp_admin_password_prod:
    file: ${WP_ADMIN_PASSWORD_FILE}
  backup_s3_key_prod:
    file: ${BACKUP_S3_KEY_FILE}
  backup_s3_secret_prod:
    file: ${BACKUP_S3_SECRET_FILE}
  smtp_password_prod:
    file: ${SMTP_PASSWORD_FILE}
