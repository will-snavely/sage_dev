services:
  web:
    depends_on:
      - db
      - redis
    image: "horsecatdog/${PROJECT}:${WEB_IMAGE_TAG:-latest}"
    restart: always
    # Needed so the entrypoint can a2ensite/a2enmod and edit ports.conf on
    # every start; it drops to www-data itself before exec'ing apache2ctl.
    user: root
    entrypoint:
        ["/bin/sh", "/app/scripts/web/prod_entrypoint.sh"]
    environment:
      BEDROCK_ROOT: "/www/srv"
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB: ${WORDPRESS_DB}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password_prod
      WP_DEBUG: ${WP_DEBUG}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password_prod
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
      WEB_PROTOCOL: ${WEB_PROTOCOL}
      WP_ENVIRON: ${WP_ENV}
      PROJECT: ${PROJECT}
      THEME: ${THEME}
      WORDPRESS_SMTP_HOST: ${WORDPRESS_SMTP_HOST}
      WORDPRESS_SMTP_PORT: ${WORDPRESS_SMTP_PORT}
      WORDPRESS_SMTP_ENCRYPTION: ${WORDPRESS_SMTP_ENCRYPTION}
      WORDPRESS_SMTP_USER: ${WORDPRESS_SMTP_USER}
      WORDPRESS_SMTP_PASS_FILE: /run/secrets/smtp_password_prod
      WORDPRESS_SMTP_FROM_EMAIL: ${WORDPRESS_SMTP_FROM_EMAIL}
      WORDPRESS_SMTP_FROM_NAME: ${WORDPRESS_SMTP_FROM_NAME}
    volumes:
      - ./scripts:/app/scripts
      - wp_uploads_prod:/www/srv/${PROJECT}/web/app/uploads
      # Acorn's compiled Blade view cache (including the WooCommerce
      # template "loader" files - see ThemeServiceProvider::fixMakeLoaderMacro()).
      # Previously NOT persisted, wiped on every container recreate - normal
      # for a stateless container, but it meant every single deploy forced
      # a full re-compile of every Blade view from a cold, empty directory,
      # with real production traffic hitting it immediately. That cold-cache
      # stampede on a popular page (/my-account/) racing to compile the
      # same view concurrently is the most likely trigger for the
      # 2026-08-14 outage. Persisting it removes the recurring trigger
      # entirely (deploys no longer start from empty) and is also just
      # faster - Laravel/Acorn already recompiles automatically if a source
      # template's mtime changes, so this doesn't risk serving a stale
      # compiled view after a real theme update, it just stops discarding
      # good compiled output for no reason.
      - wp_acorn_cache_prod:/www/srv/${PROJECT}/web/app/cache/acorn
      # Generated once by `task configure` (see gen_bedrock_env.py /
      # gen_apache_conf.py) and persisted on the host, so a container
      # restart or recreate doesn't lose them and doesn't need config
      # regenerated inside the container.
      - ./config/bedrock.env:/www/srv/${PROJECT}/.env:ro
      - ./config/apache-wordpress.conf:/etc/apache2/sites-available/wordpress.conf:ro
    secrets:
      - db_password_prod
      - wp_admin_password_prod
      - smtp_password_prod
    networks:
      - frontend_network
      - backend_network

  db:
    image: "mariadb:latest"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_prod
      MARIADB_DATABASE: wordpress_prod
      MARIADB_USER: wordpress_prod
      MARIADB_PASSWORD_FILE: /run/secrets/db_password_prod
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    secrets:
      - db_password_prod
      - db_root_password_prod
    networks:
      - backend_network

  # Persistent object cache backend for the redis-cache plugin (object-cache.php
  # drop-in). No host port exposed and no volume - object cache data is fine
  # to lose on a redeploy/restart, it just repopulates from MySQL on the next
  # requests. allkeys-lru caps memory instead of growing unbounded/OOMing,
  # trading (rare) early eviction of cold keys for a bounded footprint.
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend_network

  proxy:
    depends_on:
      - web
    image: nginx:stable-alpine
    environment:
      PROXY_PORT_HTTP: ${PROXY_PORT_HTTP}
      PROXY_PORT_HTTPS: ${PROXY_PORT_HTTPS}
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
    ports:
      - "${LOCAL_PORT_HTTP}:${PROXY_PORT_HTTP}"
      - "${LOCAL_PORT_HTTPS}:${PROXY_PORT_HTTPS}"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/html
    networks:
      - frontend_network

  # databack/mysql-backup underwent a breaking rewrite at some point while
  # pinned to :latest (a live example of exactly the risk unpinned tags
  # carry) - it's now a subcommand CLI (dump/prune/restore), not a bare
  # env-var-driven daemon, and needs an explicit `dump` command. Verified
  # against the actual running image, not just docs, since several of its
  # own doc sources turned out stale/inconsistent with real behavior:
  #   - DB_SERVER/DB_PORT/DB_USER/DB_PASS_FILE: still correct, confirmed
  #     via viper's "db"-prefixed env binding in cmd/root.go and an actual
  #     successful DB connection in testing.
  #   - DB_NAMES doesn't exist any more - renamed to DB_DUMP_INCLUDE.
  #   - DB_DUMP_FREQ -> DB_DUMP_FREQUENCY, DB_DUMP_KEEP -> DB_DUMP_RETENTION
  #     (also a format change: retention is now "14d"/"2w" style, not a
  #     bare number), confirmed via viper's "db_dump"-prefixed binding in
  #     cmd/dump.go and DB_DUMP_TARGET working correctly in testing.
  #   - AWS_* / AWS_*_FILE env vars (both bare and DB_-prefixed) do NOT
  #     work despite the tool's own --help text explicitly claiming
  #     AWS_ACCESS_KEY_ID etc. are supported - confirmed empirically: set
  #     every naming variant, got "static credentials are empty" every
  #     time. Only the --aws-* CLI flags actually work, confirmed by the
  #     same test succeeding once passed as flags instead. Secrets are
  #     read from the mounted files at container start (command below),
  #     not baked into this file, so it still keeps values out of both
  #     the compose YAML and `docker inspect`'s environment listing.
  backup:
    depends_on:
      - db
    image: databack/mysql-backup:latest
    restart: always
    environment:
      DB_SERVER: db
      DB_PORT: 3306
      DB_USER: ${WORDPRESS_DB_USER}
      DB_PASS_FILE: /run/secrets/db_password_prod
      DB_DUMP_INCLUDE: ${WORDPRESS_DB}
      DB_DUMP_TARGET: ${BACKUP_S3_TARGET}
      DB_DUMP_FREQUENCY: 1440
      DB_DUMP_BEGIN: "0300"
      DB_DUMP_RETENTION: 14d
    entrypoint: "/bin/sh"
    command: >
      -c "/mysql-backup dump
      --aws-access-key-id=$(cat /run/secrets/backup_s3_key_prod)
      --aws-secret-access-key=$(cat /run/secrets/backup_s3_secret_prod)
      --aws-region=${BACKUP_S3_REGION}
      --aws-endpoint-url=https://${BACKUP_S3_ENDPOINT}"
    secrets:
      - db_password_prod
      - backup_s3_key_prod
      - backup_s3_secret_prod
    networks:
      - backend_network

  # wp_uploads_prod holds actual uploaded files (student photos, documents,
  # etc.) - only the database was backed up before this, so anything in
  # here was one docker volume mishap away from being unrecoverable.
  # No Docker socket mount: that's only needed to pause/resume other
  # containers for consistency mid-backup, which matters for a live
  # database but not for a directory of already-written files - skipping it
  # avoids handing this container host-level access for no real benefit.
  uploads-backup:
    image: offen/docker-volume-backup:v2.48.2
    restart: always
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "wp-uploads-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: 14
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET_NAME}
      AWS_S3_PATH: uploads
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      AWS_ENDPOINT_PROTO: https
      AWS_REGION: ${BACKUP_S3_REGION}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_key_prod
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_prod
    volumes:
      - wp_uploads_prod:/backup/wp-uploads:ro
    secrets:
      - backup_s3_key_prod
      - backup_s3_secret_prod
    networks:
      - backend_network

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/html
    entrypoint: "/bin/sh"
    command: >
      -c "trap exit TERM; 
      while :; do 
        certbot renew; 
        sleep 12h & wait $${!}; 
      done;"

volumes:
  mariadb_prod_data:
  wp_uploads_prod:
  wp_acorn_cache_prod:
  certbot-etc:
  certbot-var:
  webroot:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge

secrets:
  db_password_prod:
    file: ${DB_WORDPRESS_PASSWORD_FILE}
  db_root_password_prod:
    file: ${DB_ROOT_PASSWORD_FILE}
  wp_admin_password_prod:
    file: ${WP_ADMIN_PASSWORD_FILE}
  backup_s3_key_prod:
    file: ${BACKUP_S3_KEY_FILE}
  backup_s3_secret_prod:
    file: ${BACKUP_S3_SECRET_FILE}
  smtp_password_prod:
    file: ${SMTP_PASSWORD_FILE}
