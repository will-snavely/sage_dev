services:
  proxy:
    depends_on:
      - web
    image: nginx:alpine
    entrypoint:
        ["/bin/sh", "/app/scripts/proxy/dev_entrypoint.sh"]
    environment:
      USE_HTTPS: ${USE_HTTPS}
      PROXY_PORT_HTTP: ${PROXY_PORT_HTTP}
      PROXY_PORT_HTTPS: ${PROXY_PORT_HTTPS}
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
    ports:
      - "${LOCAL_PORT_HTTP}:${PROXY_PORT_HTTP}"
      - "${LOCAL_PORT_HTTPS}:${PROXY_PORT_HTTPS}"
    volumes:
      - ./scripts:/app/scripts
      - ${CERTS_PATH}:/etc/letsencrypt:ro
    networks:
      - dev_network

  web:
    depends_on:
      - db
      - mailpit
      - redis
    image: "horsecatdog/bedrock-dev:latest"
    build: !reset null
    entrypoint:
        ["/bin/sh", "/app/scripts/web/dev_entrypoint.sh"]
    environment:
      BEDROCK_ROOT: "/www/srv"
      DEV_GROUP_ID: ${DEV_GROUP_ID}
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_REDIS_HOST: "redis"
      WORDPRESS_REDIS_PORT: "6379"
      WORDPRESS_DB: ${WORDPRESS_DB}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password_dev
      WP_DEBUG: ${WP_DEBUG}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password_dev
      WP_ENVIRON: ${WP_ENV}
      WEB_HOSTNAME: ${WEB_HOSTNAME}
      WEB_PORT: ${WEB_PORT_HTTP}
      WEB_PROTOCOL: ${WEB_PROTOCOL}
      PROJECTS_DIR: ${PROJECTS_DIR}
      PROJECT: ${PROJECT}
      THEME: ${THEME}
      WORDPRESS_SMTP_HOST: ${WORDPRESS_SMTP_HOST}
      WORDPRESS_SMTP_PORT: ${WORDPRESS_SMTP_PORT}
      WORDPRESS_SMTP_ENCRYPTION: ${WORDPRESS_SMTP_ENCRYPTION}
      DEV_SKIP_REGISTRATION_LOGOUT: ${DEV_SKIP_REGISTRATION_LOGOUT}
    volumes:
      - ${PROJECTS_DIR}:/www/srv
      - ./scripts:/app/scripts
      - composer_cache_dev:/var/www/.cache/composer
    secrets:
      - db_password_dev
      - wp_admin_password_dev
    networks:
      - dev_network
    expose:
      - "5173"
      - "${WEB_PORT_HTTP}"

  db:
    image: "mariadb:latest"
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_dev
      MARIADB_DATABASE: wordpress_dev
      MARIADB_USER: wordpress_dev
      MARIADB_PASSWORD_FILE: /run/secrets/db_password_dev
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    secrets:
      - db_password_dev
      - db_root_password_dev
    expose:
      - "3306"
    networks:
      - dev_network

  # Same image/config as prod's redis service - see compose.prod.yaml for
  # rationale (no volume, no exposed port, allkeys-lru cap).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    networks:
      - dev_network

  # Catches all outgoing mail instead of actually delivering it - view what
  # WordPress sends (registration OTPs, password resets, etc.) at
  # http://localhost:${MAILPIT_WEB_PORT}. Accepts SMTP with no auth/TLS, so
  # WPMS_SMTP_AUTH is made conditional in application.php specifically so
  # dev (no SMTP_USER set) doesn't force an auth attempt this doesn't support.
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "${MAILPIT_WEB_PORT}:8025"
    expose:
      - "1025"
      - ${MAILPIT_WEB_PORT}
    networks:
      - dev_network

volumes:
  mariadb_dev_data:
  composer_cache_dev:

networks:
  dev_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

secrets:
  db_password_dev:
    file: ${DB_WORDPRESS_PASSWORD_FILE}
  db_root_password_dev:
    file: ${DB_ROOT_PASSWORD_FILE}
  wp_admin_password_dev:
    file: ${WP_ADMIN_PASSWORD_FILE}
