server {
    listen PROXY_PORT_HTTP;
    server_name WEB_HOSTNAME; 

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://web:WEB_PORT;
        # $host silently drops any port from the incoming Host header;
        # $http_host preserves it verbatim. Invisible when published on the
        # protocol's default port (80), but a non-default port (e.g. the
        # isolated test stack, see Taskfile.test.yml) then mismatches
        # WP_HOME's port-including URL and sends redirect_canonical() into
        # an infinite self-redirect on every page.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_headers_hash_max_size 512;
        proxy_headers_hash_bucket_size 128;
    }
}
